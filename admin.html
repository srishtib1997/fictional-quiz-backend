<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Fictional Quiz 2.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #0a0e27 100%);
            min-height: 100vh;
            color: #fff;
        }

        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: rgba(15, 15, 35, 0.95);
            border-radius: 15px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            border: 2px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .login-box h1 {
            color: #FFD700;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .login-box p {
            color: #00FFFF;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #FFD700;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(0, 255, 255, 0.3);
            background: rgba(20, 20, 50, 0.8);
            color: #00FFFF;
            border-radius: 8px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00FFFF;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }

        .dashboard {
            display: none;
            padding: 40px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .dashboard-header h1 {
            color: #FFD700;
            font-size: 32px;
        }

        .dashboard-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 14px;
        }

        .btn-export {
            background: linear-gradient(135deg, #00FF00, #00FFAA);
            color: #000;
        }

        .btn-export:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .btn-logout {
            background: rgba(255, 20, 147, 0.6);
            color: #fff;
            border: 2px solid #FF1493;
        }

        .btn-logout:hover {
            background: rgba(255, 20, 147, 0.9);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(50, 50, 100, 0.5), rgba(30, 30, 60, 0.5));
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 36px;
            color: #FFD700;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #00FFFF;
            font-size: 14px;
            text-transform: uppercase;
        }

        .table-container {
            overflow-x: auto;
            background: rgba(15, 15, 35, 0.95);
            border-radius: 12px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.3), rgba(255, 100, 200, 0.2));
            color: #FFD700;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
            text-transform: uppercase;
            font-size: 12px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
            color: #00FFFF;
        }

        tr:hover {
            background: rgba(0, 255, 255, 0.05);
        }

        .loading {
            text-align: center;
            color: #00FFFF;
            padding: 40px;
            font-size: 18px;
        }

        .error-message {
            background: rgba(255, 20, 147, 0.2);
            color: #FF1493;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 20, 147, 0.5);
        }

        .success-message {
            background: rgba(0, 255, 0, 0.2);
            color: #00FF00;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 0, 0.5);
        }

        @media (max-width: 768px) {
            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <!-- Login Form -->
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <h1>🔐 Admin Login</h1>
            <p>Fictional Quiz 2.0 Dashboard</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="admin" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••" required>
                </div>
                <button type="submit" class="login-btn">Login</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="dashboard-header">
            <h1>📊 Registrations Dashboard</h1>
            <div class="dashboard-actions">
                <button class="btn btn-export" id="exportBtn">📥 Export to Excel</button>
                <button class="btn btn-logout" id="logoutBtn">🚪 Logout</button>
            </div>
        </div>

        <div id="message"></div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalTeams">0</div>
                <div class="stat-label">Total Teams</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalMembers">0</div>
                <div class="stat-label">Total Members</div>
            </div>
        </div>

        <div class="table-container">
            <div id="loading" class="loading">Loading registrations...</div>
            <table id="registrationsTable" style="display: none;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Member 1</th>
                        <th>Email</th>
                        <th>Employee ID</th>
                        <th>Member 2</th>
                        <th>Email</th>
                        <th>Employee ID</th>
                        <th>Member 3</th>
                        <th>Email</th>
                        <th>Employee ID</th>
                        <th>Registered</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let authToken = null;

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    authToken = data.token;
                    document.getElementById('loginContainer').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    loadRegistrations();
                    loadStats();
                } else {
                    alert('Invalid credentials');
                }
            } catch (error) {
                alert('Login error: ' + error.message);
            }
        });

        // Load registrations
        async function loadRegistrations() {
            const loading = document.getElementById('loading');
            const table = document.getElementById('registrationsTable');
            const tbody = document.getElementById('tableBody');

            try {
                const response = await fetch('/api/admin/registrations', {
                    headers: { 'Authorization': authToken }
                });

                const registrations = await response.json();
                loading.style.display = 'none';
                table.style.display = 'table';

                tbody.innerHTML = '';
                registrations.forEach(reg => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${reg.id}</td>
                        <td>${reg.member1_name}</td>
                        <td>${reg.member1_email}</td>
                        <td>${reg.member1_employee_id}</td>
                        <td>${reg.member2_name}</td>
                        <td>${reg.member2_email}</td>
                        <td>${reg.member2_employee_id}</td>
                        <td>${reg.member3_name}</td>
                        <td>${reg.member3_email}</td>
                        <td>${reg.member3_employee_id}</td>
                        <td>${new Date(reg.created_at).toLocaleString()}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                loading.innerHTML = 'Error loading registrations: ' + error.message;
            }
        }

        // Load statistics
        async function loadStats() {
            try {
                const response = await fetch('/api/admin/stats', {
                    headers: { 'Authorization': authToken }
                });

                const stats = await response.json();
                document.getElementById('totalTeams').textContent = stats.total_teams;
                document.getElementById('totalMembers').textContent = stats.total_members;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Export to Excel
        document.getElementById('exportBtn').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/admin/export-excel', {
                    headers: { 'Authorization': authToken }
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'Quiz_Registrations.xlsx';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                } else {
                    alert('Error exporting file');
                }
            } catch (error) {
                alert('Export error: ' + error.message);
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            authToken = null;
            document.getElementById('loginContainer').style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('loginForm').reset();
        });
    </script>
</body>
</html>
